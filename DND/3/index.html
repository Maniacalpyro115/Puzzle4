<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Login Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login">
  <h2>Secure Login</h2>

  <input
    id="username"
    type="text"
    placeholder="Username"
    autocomplete="off"
  />

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="off"
  />

  <button onclick="login()">Sign In</button>

  <p id="result"></p>
</div>

<script src="login.js"></script>
</body>
</html>
